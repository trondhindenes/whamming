<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Menu bar template icon: black + alpha only; macOS tints it for light/dark menu bars.
       A small version of the app icon's robot: antenna ball, dome, visor with two eyes, popping out of a hole. -->
  <defs>
    <mask id="robot">
      <rect width="32" height="32" fill="#fff"/>
      <!-- visor cut out of the dome -->
      <rect x="10" y="13.2" width="12" height="7" rx="3.5" fill="#000"/>
    </mask>
    <mask id="hole">
      <rect width="32" height="32" fill="#fff"/>
      <!-- keep a hairline gap between the hole and the body so the two read as separate shapes -->
      <path d="M7.4 28 V16.8 C7.4 11.6 11.2 8.4 16 8.4 C20.8 8.4 24.6 11.6 24.6 16.8 V28 Z" fill="#000"/>
    </mask>
  </defs>
  <!-- antenna -->
  <circle cx="16" cy="4.2" r="2.5" fill="#000"/>
  <path d="M16 6.4 V9.6" stroke="#000" stroke-width="1.7" stroke-linecap="round"/>
  <!-- dome body -->
  <path d="M8.8 26.2 V16.8 C8.8 12.4 12 9.6 16 9.6 C20 9.6 23.2 12.4 23.2 16.8 V26.2 Z" fill="#000" mask="url(#robot)"/>
  <!-- eyes, glancing up like the app icon -->
  <circle cx="13.6" cy="16.3" r="1.55" fill="#000"/>
  <circle cx="18.4" cy="16.3" r="1.55" fill="#000"/>
  <!-- the hole -->
  <ellipse cx="16" cy="26.6" rx="13" ry="3.4" fill="#000" mask="url(#hole)"/>
</svg>
