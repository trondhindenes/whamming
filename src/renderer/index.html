<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" />
    <title>Whamming</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar">
        <div class="titlebar-space"></div>
        <div class="brand" title="Whamming: what am I working on?">
          <div class="brand-mark">W</div>
          <span>Whamming</span>
        </div>
        <nav class="nav" id="nav"></nav>
        <div class="nav-section" title="Folders with running sessions">Folders</div>
        <nav class="nav folders" id="folders"></nav>
        <div class="sidebar-footer">
          <button class="footer-btn" id="setup-btn" title="Set up the command line tool, Claude Code hooks and agent instructions">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M5 4 1.5 8 5 12M11 4l3.5 4L11 12M9.5 2.5l-3 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Agent setup
          </button>
          <div class="conn" id="conn"><span class="conn-dot"></span><span id="conn-label">Connecting…</span></div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar-title"><span id="view-title">All sessions</span><span class="count" id="view-count"></span></div>
          <div class="topbar-actions">
            <div class="menu-wrap">
              <button class="ghost-btn" id="cleanup-btn" aria-haspopup="menu" aria-expanded="false" title="Remove exited sessions, or clear the whole list">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8a1 1 0 0 0 1 .9h3.8a1 1 0 0 0 1-.9l.6-8M6.8 7v4M9.2 7v4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Clean up
              </button>
              <div class="menu" id="cleanup-menu" role="menu" hidden></div>
            </div>
            <div class="segmented" id="group-by">
              <button data-group="status" class="active" title="Group sessions by status">Status</button>
              <button data-group="folder" title="Group sessions by folder">Folder</button>
            </div>
            <label class="search" title="Filter by title, folder, session, branch or port (press /)">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              <input id="search" placeholder="Filter…" spellcheck="false" autocomplete="off" />
              <kbd>/</kbd>
            </label>
          </div>
        </header>
        <div class="list" id="list"></div>
      </main>

      <section class="detail" id="detail" hidden></section>
    </div>

    <div class="modal-backdrop" id="modal" hidden>
      <div class="modal" role="dialog" aria-labelledby="modal-title">
        <div class="modal-head">
          <h2 id="modal-title">Agent setup</h2>
          <button class="icon-btn" id="modal-close" aria-label="Close" title="Close (Esc)">
            <svg width="14" height="14" viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
